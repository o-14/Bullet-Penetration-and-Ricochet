[Diagnostics]
DetailedLogging=false

[Visuals]
# Hides complete stock tracer/vapor effects on initial and continued shots.
SuppressProjectileTrails=true

[Defaults]
# Safe fallbacks for ammo or materials that do not have an exact assignment.
ProjectileProfile=standard
SurfaceFamily=general
UnknownAmmoDepth=10.0

[Penetration]
# Higher values retain more damage after crossing a surface.
DamageFalloffExponent=4.0
# Maximum direction change after leaving a penetrated surface. Zero keeps the original path.
VariationDegrees=0.0
# Prevents an immediate repeat collision with the same actor.
PreventRepeatActor=true

[Receiver]
# Uses the perk-free fired weapon instance as a secondary penetration modifier.
Enabled=true
Influence=1.0
Minimum=0.25
Maximum=4.0

[Ricochet]
Enabled=true
AllowProps=true
# Percentage chance that an otherwise valid ricochet occurs.
ChancePercent=50.0
# Higher values require a more glancing impact. Lower values allow more direct impacts.
HeadOnExclusionDegrees=70.0
# Percentage energy costs; advanced users should keep the defaults.
BaseEnergyCost=18.0
IncidenceEnergyCost=24.0
RepeatPenalty=0.30
VariationDegrees=3.0

[Player]
Penetration=true
Ricochet=true
# Zero means unlimited.
PenetrationLimit=0
RicochetLimit=2

[NPC]
Penetration=true
Ricochet=true
# Zero means unlimited.
PenetrationLimit=0
RicochetLimit=2

[UnknownShooter]
Penetration=true
Ricochet=true
PenetrationLimit=0
RicochetLimit=2

[Geometry]
# Advanced collision tolerances. Defaults are recommended.
EntrySeparation=0.35
DuplicateSeparation=0.10
OutwardAlignment=0.015
ReverseAgreement=0.35
